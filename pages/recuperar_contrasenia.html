<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar ontraseña</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../styles/styles.css">
        <link rel="icon" href="../assets/images/Icono-logo-rectangular.ico">
        
    </head>

    <body class="recuperar_contraseña">

        <header class="header">
            <a class="logo_nav" href="../index.html"><img class="logo_nav"
                    src="../assets/images/logo.png" alt="Logo"></a>
        </header>

        <main class="recuperar_contraseña">
            <h1 class="titulo">Recuperar contraseña</h1>

            <h3 class="aclaracion">
                Te enviaremos un email con las instrucciones sobre cómo
                restablecer
                tu contraseña
            </h3>

            <div class="container_rec">

                <form action="../index.html" class="form" id="form_recuperar_contrasenia">
                    <div class="form_correo">
                        <label class="E-mail referencia_inputField">E-mail</label>
                        <input type="text" placeholder="ingrese su correo"
                            class="correo input_field"  id="email_recuperar_contrasenia" >
                    </div>

                    <div class="form_correo">
                        <label class="Usuario referencia_inputField">Usuario</label>
                        <input type="text" placeholder="ingrese su usuario"
                            class="correo input_field" id="usuario_recuperar_contrasenia">

                    </div>

                    <div class="boton">

                          <button disabled class="boton_recu_contraseña botonDeshabilitado" id="enviar_recuperar_contrasenia" >Enviar</button>
                        <button type="button" class="boton_recu_contraseña">Cancelar</button>
                    </div>
                </form>
                </div>
            </main>
            <footer>
                <article class="interaccion">
                <a href="#" class="contactanos">Contactanos</a>
                <ul class="redes_sociales">
                    <i class="bi bi-facebook"></i>
                    <i class="bi bi-twitter"></i>
                    <i class="bi bi-instagram"></i>
                </ul>
            </article>
                <p class="copyright">&copy; 2024 CartucheraCode | Todos los derechos reservados</p>
            </footer> 
            <script src="../scripts/recuperar_contrasenia.js"></script>
        </body>
        
    </html>
